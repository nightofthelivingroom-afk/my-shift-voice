<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MY SHIFT 音声登録 試作</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#eef3ff;background:#101d32}*{box-sizing:border-box}body{margin:0;padding:22px 16px 50px}.wrap{max-width:580px;margin:auto}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:27px;margin:0}small,.muted{color:#aebbd0}.panel{background:#1b2b44;border:1px solid #344660;border-radius:18px;padding:20px;margin-top:20px}.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:18px}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.5}.yellow{background:#f4cc50;color:#192338}.mic{font-size:23px;padding:11px 17px}.outline{background:#344660;color:white}.danger{background:#563647;color:white}.status{min-height:22px;color:#f4cc50;font-size:14px}.field{width:100%;background:#0e1c31;color:white;border:1px solid #50617a;border-radius:9px;padding:12px;font-size:16px;margin:7px 0 14px}label{display:block;font-size:13px;color:#b7c5dc}.hidden{display:none}.item{padding:14px 0;border-bottom:1px solid #344660}.item:last-child{border:0}.tag{display:inline-block;background:#2b4563;border-radius:8px;padding:4px 9px;font-size:12px}.note{font-size:13px;line-height:1.7;color:#b7c5dc}.confirm{border:1px solid #e5bf55;border-radius:12px;padding:14px;margin-top:12px}#recognized{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><div class="wrap"><header><div><h1>MY SHIFT</h1><small>音声登録・試作版</small></div><span class="tag">TEST</span></header><section class="panel"><h2>出勤予定を追加</h2><p class="note">例：「11月1日22時から翌朝9時」「11月2日0時から9時」</p><div class="actions"><button class="yellow mic" id="mic" aria-label="音声入力開始">🎙</button><button class="yellow" id="manual">＋ 予定を追加</button></div><p id="status" class="status" role="status"></p><p id="recognized" class="muted"></p><div id="form" class="hidden"><label>勤務日（午前5時切り替え）<input class="field" type="date" id="date"></label><label>開始時刻<input class="field" type="time" id="start"></label><label>終了時刻<input class="field" type="time" id="end"></label><label>終了日<input class="field" type="date" id="endDate"></label><div class="confirm">登録前に日付と時間を確認してください。<div id="preview" style="margin-top:10px;font-weight:700"></div></div><div class="actions"><button class="outline" id="cancel">キャンセル</button><button class="yellow" id="save">確認して保存</button></div></div></section><section class="panel"><h2>試作版の登録一覧</h2><div id="items"></div></section><p class="note">※この試作版の予定はこのブラウザ内に保存されます。公開中のMY SHIFTには反映されません。音声認識はブラウザの対応状況・マイク許可に依存します。iPhoneでローカルHTMLを開いた場合、音声認識が利用できないことがあります。音声が使えない場合は「＋予定を追加」で手入力を試せます。</p></div><script>
const $=id=>document.getElementById(id),key='myshift-voice-prototype-v1';let entries=[];try{entries=JSON.parse(localStorage.getItem(key)||'[]')}catch{};const pad=n=>String(n).padStart(2,'0');const localDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const addDay=(s,n)=>{let [y,m,d]=s.split('-').map(Number),x=new Date(y,m-1,d+n);return localDate(x)};const today=new Date();function parseSpeech(raw){let s=raw.replace(/\s/g,'').replace(/[、。]/g,'').replace(/午前零時/g,'0時').replace(/深夜0時/g,'0時').replace(/午後([0-9０-９]+)時/g,(_,n)=>`${Number(normalize(n))+12}時`);s=normalize(s);let md=s.match(/(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日/);if(!md)return null;let year=md[1]?+md[1]:today.getFullYear(),month=+md[2],day=+md[3];if(month<1||month>12||day<1||day>31)return null;let dt=new Date(year,month-1,day);if(dt.getMonth()+1!==month||dt.getDate()!==day)return null;let times=[...s.matchAll(/(\d{1,2})(?:時|:)(?:(\d{1,2})分?)?/g)].map(m=>({h:+m[1],m:+(m[2]||0),index:m.index}));if(times.length<2)return null;let a=times[0],b=times[1];if(a.h>24||b.h>24||a.m>59||b.m>59||a.h===24&&a.m||b.h===24&&b.m)return null;let workDate=localDate(dt),startDate=addDay(workDate,a.h===24?1:0);let startHour=a.h%24;let endDate=startDate;let endHour=b.h%24;let tail=s.slice(times[0].index+1);if(/翌朝|翌日|次の日/.test(tail)||b.h===24||endHour*60+b.m<=startHour*60+a.m)endDate=addDay(startDate,1);if(a.h<5 && a.h!==24 && !/翌朝|翌日/.test(s.slice(0,times[0].index))){/* User's explicit date is the work-date label; clock time is on following civil date. */startDate=addDay(workDate,1);endDate=startDate;if(b.h===24||endHour*60+b.m<=startHour*60+a.m)endDate=addDay(startDate,1)}return {date:workDate,start:`${pad(startHour)}:${pad(a.m)}`,end:`${pad(endHour)}:${pad(b.m)}`,endDate};}
function normalize(s){return s.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/([一二三四五六七八九十]+)(?=月|日|時|分)/g,x=>{const n={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};if(x==='十')return '10';if(x.includes('十')){let [a,b]=x.split('十');return String((a?n[a]:1)*10+(b?n[b]:0))}return String(n[x]||x)})}
function showForm(v){$('form').classList.remove('hidden');$('date').value=v.date;$('start').value=v.start;$('end').value=v.end;$('endDate').value=v.endDate;preview()}function preview(){$('preview').textContent=`${$('date').value}（勤務日） ${$('start').value} ～ ${$('endDate').value} ${$('end').value}`};['date','start','end','endDate'].forEach(id=>$(id).addEventListener('input',preview));$('manual').onclick=()=>{let d=localDate(today);showForm({date:d,start:'22:00',end:'09:00',endDate:addDay(d,1)});$('status').textContent='日時を入力して確認してください。'};$('cancel').onclick=()=>{$('form').classList.add('hidden')};$('save').onclick=()=>{let date=$('date').value,start=$('start').value,end=$('end').value,endDate=$('endDate').value;if(!date||!start||!end||!endDate){alert('すべて入力してください');return}let startDate=(+start.slice(0,2)<5)?addDay(date,1):date;if(new Date(`${endDate}T${end}:00`)<=new Date(`${startDate}T${start}:00`)){alert('終了日時を確認してください');return}entries.push({date,start,end,endDate,id:Date.now()+Math.random()});localStorage.setItem(key,JSON.stringify(entries));render();$('form').classList.add('hidden');$('status').textContent='試作版に保存しました。公開中のMY SHIFTには反映されません。'};function render(){$('items').replaceChildren();if(!entries.length){$('items').textContent='まだ予定はありません。';return}entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{let d=document.createElement('div');d.className='item';let t=document.createElement('div');t.textContent=`${e.date}　${e.start} ～ ${e.endDate} ${e.end}`;let b=document.createElement('button');b.className='danger';b.textContent='削除';b.style.marginTop='8px';b.onclick=()=>{if(confirm('この予定を削除しますか？')){entries=entries.filter(x=>x.id!==e.id);localStorage.setItem(key,JSON.stringify(entries));render()}};d.append(t,b);$('items').append(d)})}render();let SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;$('mic').onclick=()=>{$('status').textContent='マイクボタンを押しました。音声認識を確認しています…';if(!SpeechRecognition){$('status').textContent='この環境では音声認識を利用できません。Safariなど対応ブラウザで試すか、手入力してください。';return}let r=new SpeechRecognition();r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=1;$('status').textContent='聞き取り中… 出勤予定を話してください';$('mic').disabled=true;r.onresult=e=>{let t=e.results[0][0].transcript;$('recognized').textContent=`認識結果：${t}`;let v=parseSpeech(t);if(v){showForm(v);$('status').textContent='内容を確認して保存してください。'}else{$('status').textContent='日時を読み取れませんでした。もう一度話すか、手入力してください。'}};r.onerror=e=>{$('status').textContent=`音声認識エラー（${e.error}）。マイクの許可やブラウザを確認してください。`};r.onend=()=>{$('mic').disabled=false};try{r.start()}catch(e){$('mic').disabled=false;$('status').textContent='音声認識を開始できませんでした。'}};


const originalRender = render;

render = function () {
  originalRender();

  const rows = document.querySelectorAll("#items .item");
  const sorted = entries.slice().sort((a, b) =>
    a.date.localeCompare(b.date)
  );

  rows.forEach((row, i) => {
    const entry = sorted[i];
    if (!entry) return;

    const label = document.createElement("label");
    label.textContent = "備考";
    label.style.marginTop = "12px";

    const note = document.createElement("textarea");
    note.className = "field";
    note.rows = 3;
    note.placeholder = "備考を入力";
    note.value = entry.note || "";

    const status = document.createElement("small");

    note.addEventListener("input", () => {
      entry.note = note.value;
      try {
        localStorage.setItem(key, JSON.stringify(entries));
        status.textContent = "保存しました";
      } catch (e) {
        status.textContent = "保存できませんでした";
      }
    });

    row.append(label, note, status);
  });
};

render();

  );

  rows.forEach((row, i) => {
    const entry = sorted[i];
    if (!entry) return;

    note.className = "field";
    note.rows = 3;
    note.placeholder = "備考を入力";
    note.value = entry.note || "";

    const status = document.createElement("small");

    note.addEventListener("input", () => {

      localStorage.setItem(key, JSON.stringify(entries));

</script></body></html>
